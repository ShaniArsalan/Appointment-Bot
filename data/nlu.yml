version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Hello
      - Hi
      - Hey

  - intent: affirm
    examples: |
      - Yes
      - Yeah
      - Sure
      - Of course

  - intent: deny
    examples: |
      - No
      - Not now
      - Maybe later

  - intent: provide_service
    examples: |
      - Regular checkup
      - Teeth cleaning
      - I want a regular checkup
      - I'd like teeth cleaning
      - Something else

  - intent: provide_insurance
    examples: |
      - Public
      - Private
      - Not insured
      - I am privately insured
      - I don't have insurance

  - intent: provide_appointment_time
    examples: |
      - 10 AM on Monday
      - 2 PM next Friday
      - 11 AM tomorrow
      - Next Tuesday at 3 PM

  - intent: provide_name
    examples: |
      - My name is John Doe
      - John Doe
      - It's Jane Smith
      - Jane Smith

