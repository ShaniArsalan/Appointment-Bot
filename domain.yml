version: "3.1"

intents:
  - greet
  - affirm
  - deny
  - inform
  - provide_service
  - provide_insurance
  - provide_appointment_time
  - provide_name

entities:
  - service
  - insurance_type
  - appointment_time
  - appointment_date
  - full_name

slots:
  service:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: service
      - type: from_text

  insurance_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: insurance_type
      - type: from_text

  appointment_time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: appointment_time
      - type: from_text

  appointment_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: appointment_date
      - type: from_text

  full_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: full_name
      - type: from_text

responses:
  utter_welcome:
    - text: "Hello! Welcome to the dental clinic. I’m here to assist you with scheduling an appointment. Are you looking to schedule an appointment today?"
      buttons:
        - title: "Yes"
          payload: "/affirm"
        - title: "No"
          payload: "/deny"

  utter_not_interested:
    - text: "Thank you! If you want to schedule an appointment, feel free to reach out. Have a great day!"

  utter_ask_service:
    - text: "Sure! Which service would you like to book an appointment for?"
      buttons:
        - title: "Regular checkup"
          payload: "/provide_service{\"service\":\"regular checkup\"}"
        - title: "Teeth cleaning"
          payload: "/provide_service{\"service\":\"teeth cleaning\"}"
        - title: "Other"
          payload: "/provide_service{\"service\":\"other\"}"

  utter_ask_insurance_type:
    - text: "Great! Before we proceed, could you please let me know if you are publicly insured or private?"
      buttons:
        - title: "Public"
          payload: "/provide_insurance{\"insurance_type\":\"public\"}"
        - title: "Private"
          payload: "/provide_insurance{\"insurance_type\":\"private\"}"
        - title: "Not Insured"
          payload: "/provide_insurance{\"insurance_type\":\"not insured\"}"

  utter_default:
    - text: "I’m sorry, but it seems we are unable to book a slot for you. Please try again later. Thank you for reaching out to the dental clinic!"

  utter_ask_appointment:
    - text: "Thank you! Could you please provide your preferred date and time for the appointment?"

  utter_out_of_office:
    - text: "I am sorry! But our office timings are from Monday to Friday, 8 AM to 5 PM. Please schedule your appointment during business hours."
      buttons:
        - title: "Choose another time"
          payload: "/provide_appointment_time"

  utter_suggest_appointment:
    - text: "{appointment_date} at {appointment_time}. Would you like to confirm this appointment?"
      buttons:
        - title: "Yes"
          payload: "/affirm"
        - title: "Choose another time"
          payload: "/provide_appointment_time"

  utter_ask_full_name:
    - text: "Thank you! May I have your full name for booking purposes?"

  utter_goodbye:
    - text: "Appointment successfully booked for {full_name} on {appointment_date} at {appointment_time}. See you soon! Goodbye!"

actions:
  - action_check_availability
  - action_save_appointment

forms:
  appointment_form:
    required_slots:
      - appointment_date
      - appointment_time
      - service
      - insurance_type
      - full_name

